  <section>
    <h2>Save Reading</h2>

    <form class="reading-form">
        <div class="form-group">
            <label for="question">Question</label>
            <input
                type="text"
                id="question"
                name="question"
                placeholder="What guidance are you seeking?"
            >
        </div>

        <div class="form-group">
            <label for="interpretation">Interpretation</label>
            <textarea
                id="interpretation"
                name="interpretation"
                rows="10"
                placeholder="Record your interpretation..."
            ></textarea>
        </div>

        <button type="submit">Save Reading</button>
    </form>
</section>
