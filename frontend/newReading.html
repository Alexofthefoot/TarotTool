<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/newReading.css">
    <script src="js/newReading.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">🔮 Your Tarot Journal</div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="#">Cards</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="newReading.html">New</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main>
        <header>
            <h1>Save reading</h1>
        </header>

        <section>
            <form class="reading-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="eg. 'Daily Card Draw', 'Career Question'">
                    <label for="question">Question</label>
                    <input type="text" id="question" name="question" placeholder="What guidance are you seeking?">
                </div>
                <div class="form-group">
                    <label for="number-of-cards">Number of Cards</label>
                    <div class="button-row">
                        <button type="button" onclick="setButtons(1)">1</button>
                        <button type="button" onclick="setButtons(2)">2</button>
                        <button type="button" onclick="setButtons(3)">3</button>
                        <button type="button" onclick="setButtons(4)">4</button>
                        <button type="button" onclick="setButtons(5)">5</button>
                    </div>
                    <br>
                    <div class="card-button-row">
                        <button class="card-selection-btn" type="button">
                            <img src="../frontend/assets/Cards-png/CardBacks.png">
                        </button>
                        <button class="card-selection-btn" type="button">
                            <img src="../frontend/assets/Cards-png/CardBacks.png">
                        </button>
                        <button class="card-selection-btn" type="button">
                            <img src="../frontend/assets/Cards-png/CardBacks.png">
                        </button>
                        <button class="card-selection-btn" type="button">
                            <img src="../frontend/assets/Cards-png/CardBacks.png">
                        </button>
                        <button class="card-selection-btn" type="button">
                            <img src="../frontend/assets/Cards-png/CardBacks.png">
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="interpretation">Interpretation</label>
                    <textarea id="interpretation" name="interpretation" rows="10"
                        placeholder="Record your interpretation..."></textarea>
                </div>

                <button type="submit">Save Reading</button>
            </form>

        </section>


    </main>

</body>

</html>
